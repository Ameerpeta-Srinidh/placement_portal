{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h2 class="section-heading"><i class="bi bi-building-gear me-2"></i>Edit <span>Company Profile</span></h2>
        <p class="text-muted mb-0">Update your company information</p>
    </div>
    <a href="{{ url_for('company.dashboard') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card profile-card">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('company.edit_profile') }}">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" name="company_name" value="{{ company.company_name }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">HR Contact</label>
                            <input type="text" class="form-control" name="hr_contact" value="{{ company.hr_contact }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Industry</label>
                            <input type="text" class="form-control" name="industry" value="{{ company.industry or '' }}" placeholder="e.g. Technology, Finance">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Website</label>
                        <input type="url" class="form-control" name="website" value="{{ company.website or '' }}" placeholder="https://www.company.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">About the Company</label>
                        <textarea class="form-control" name="description" rows="3" placeholder="Short description of your company">{{ company.description or '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-check-lg me-2"></i>Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
