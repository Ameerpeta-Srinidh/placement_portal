{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="max-width: 560px;">
        <div class="text-center">
            <i class="bi bi-person-plus-fill" style="font-size: 2.5rem; color: var(--accent-orange);"></i>
            <h3 class="mt-3">Create Account</h3>
            <p class="subtitle">Register as a Student or Company</p>
        </div>
        <form method="POST" action="{{ url_for('auth.register') }}">
            
            <div class="mb-3">
                <label for="role" class="form-label">I am a...</label>
                <select class="form-select" id="role" name="role" required onchange="toggleFields()">
                    <option value="" disabled selected>Select your role</option>
                    <option value="Student">Student</option>
                    <option value="Company">Company / Recruiter</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Min. 8 characters" required minlength="8">
            </div>

            <div id="student-fields" style="display:none;">
                <hr>
                <h6 class="mb-3" style="color: var(--accent-orange); font-weight: 600;">
                    <i class="bi bi-mortarboard me-1"></i>Student Details
                </h6>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" placeholder="Your full name">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Enrollment No.</label>
                        <input type="text" class="form-control" name="enrollment_no" placeholder="e.g. 21BCE1234">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">CGPA</label>
                        <input type="number" class="form-control" name="cgpa" step="0.01" min="0" max="10" placeholder="e.g. 8.5">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Branch / Department</label>
                        <input type="text" class="form-control" name="branch" placeholder="e.g. Computer Science">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" name="phone" placeholder="e.g. 9876543210">
                    </div>
                </div>
            </div>

            <div id="company-fields" style="display:none;">
                <hr>
                <h6 class="mb-3" style="color: var(--accent-blue); font-weight: 600;">
                    <i class="bi bi-building me-1"></i>Company Details
                </h6>
                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" class="form-control" name="company_name" placeholder="e.g. Google India">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">HR Contact (Email / Phone)</label>
                        <input type="text" class="form-control" name="hr_contact" placeholder="hr@company.com">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Industry</label>
                        <input type="text" class="form-control" name="industry" placeholder="e.g. Technology">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Company Website</label>
                    <input type="url" class="form-control" name="website" placeholder="https://www.company.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Short Description</label>
                    <textarea class="form-control" name="description" rows="2" placeholder="What does your company do?"></textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3 py-2">
                <i class="bi bi-person-plus me-2"></i>Create Account
            </button>
            
            <p class="text-center mt-4" style="color: var(--text-muted); font-size: 0.9rem;">
                Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-orange); font-weight: 500;">Sign in</a>
            </p>
        </form>
    </div>
</div>

<script>
function toggleFields() {
    let role = document.getElementById('role').value;
    document.getElementById('student-fields').style.display = (role === 'Student') ? 'block' : 'none';
    document.getElementById('company-fields').style.display = (role === 'Company') ? 'block' : 'none';
}
</script>
{% endblock %}
