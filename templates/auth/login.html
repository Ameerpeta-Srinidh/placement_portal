{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="text-center">
            <i class="bi bi-mortarboard-fill" style="font-size: 2.5rem; color: var(--accent-orange);"></i>
            <h3 class="mt-3">Welcome Back</h3>
            <p class="subtitle">Sign in to your placement portal account</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-muted);"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="you@university.edu" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text" style="background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-muted);"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Min. 8 characters" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
            
            <p class="text-center mt-4" style="color: var(--text-muted); font-size: 0.9rem;">
                Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent-orange); font-weight: 500;">Register here</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
